# Recipe for the photo-tier benchmark set: <data>/photos_with_ceiling, capture apt_photo_a
# in bench/manifest.yaml, 7 room folders with 28 photos, plus truth.json.
#
#   python scripts/make_photo_set.py <data>/single_scan_with_ceiling <new folder>
#   python scripts/make_photo_set.py --check <data>/photos_with_ceiling
#
# The first rebuilds the set from the raw scan, byte for byte, and checks every file against
# the sha256 values below; the second compares an existing set with them. Only rgb.mp4 is
# read, so changes to the LiDAR pipeline cannot change the set. The set was cut on
# 2026-10-01 by an earlier version of the automatic selection (now `--select`), which
# chose rooms and frames from the LiDAR layout of that day; the layout code has changed
# since, and --select now cuts a different set from the same scan.
#
# This file was derived from that recorded set and the scan: frame is the number in each
# file name, video_frame the frame actually written (found by pixel match), rotate_cw and
# focal_35mm the values that re-encode it to the recorded bytes, truth the recorded
# truth.json. As recorded, there is no folder 03, and truth.json lists 06_room_1, which
# has no folder.
#
# frame vs video_frame: rgb.mp4 has a variable frame rate, and the selection read frame N
# with an OpenCV seek (CAP_PROP_POS_FRAMES), which lands at N / average fps: here 4 to 80
# frames after the N-th frame. The rebuild reads the video from the start and keeps the
# frames at the video_frame positions (0-based), so it does not depend on OpenCV's seek.
#
# Per photo: file; frame; video_frame; rotate_cw, degrees clockwise applied to the stored
# 1920x1440 frame; focal_35mm, written as EXIF FocalLengthIn35mmFilm (the only metadata);
# sha256 of the JPEG, written by Pillow at jpeg_quality. truth.json is written as
# json.dumps(truth, indent=2) with CRLF line ends, as recorded.
