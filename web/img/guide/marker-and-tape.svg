<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="mk-t mk-d">
  <title id="mk-t">Optional: a size you know makes photos and video accurate</title>
  <desc id="mk-d">A wall with the printed A4 scale marker stuck flat at chest height, and a tape measure along the wall from corner to corner at about one metre height. Type one wall length per room in the L or B box.</desc>
  <style>
    .mk-wall{fill:none;stroke:currentColor;stroke-width:4}
    .mk-tape{stroke:#f2c94c;stroke-width:6;stroke-linecap:butt}
    .mk-tick{stroke:#8a6d00;stroke-width:1.5}
    .mk-lbl{font:13px system-ui,sans-serif;fill:currentColor}
    .mk-b{font:600 13px system-ui,sans-serif}
  </style>
  <rect class="mk-wall" x="20" y="15" width="280" height="170"/>
  <rect x="190" y="45" width="62" height="86" fill="var(--guide-bg,#fff)" stroke="currentColor" stroke-width="1.5"/>
  <rect x="199" y="60" width="44" height="44" fill="currentColor"/>
  <rect x="205" y="66" width="12" height="12" fill="var(--guide-bg,#fff)"/>
  <rect x="223" y="78" width="12" height="18" fill="var(--guide-bg,#fff)"/>
  <rect x="207" y="86" width="9" height="9" fill="var(--guide-bg,#fff)"/>
  <line x1="199" y1="118" x2="243" y2="118" stroke="currentColor" stroke-width="1.5"/>
  <text class="mk-lbl" x="196" y="145">A4 marker</text>
  <line class="mk-tape" x1="22" y1="150" x2="298" y2="150"/>
  <g class="mk-tick">
    <line x1="50" y1="147" x2="50" y2="153"/><line x1="80" y1="147" x2="80" y2="153"/><line x1="110" y1="147" x2="110" y2="153"/>
    <line x1="140" y1="147" x2="140" y2="153"/><line x1="170" y1="147" x2="170" y2="153"/><line x1="200" y1="147" x2="200" y2="153"/>
    <line x1="230" y1="147" x2="230" y2="153"/><line x1="260" y1="147" x2="260" y2="153"/>
  </g>
  <text class="mk-lbl mk-b" x="30" y="40">L = 4.20 m</text>
  <text class="mk-lbl" x="30" y="58">tape corner to corner,</text>
  <text class="mk-lbl" x="30" y="74">~1 m above the floor</text>
  <text class="mk-lbl" x="22" y="207">one length per room is enough · marker optional</text>
</svg>
