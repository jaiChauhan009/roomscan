<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="vw-t vw-d">
  <title id="vw-t">Video or LiDAR: one slow walk through every room</title>
  <desc id="vw-d">Top view of a home with three rooms. Start at the entrance, walk slowly through every room along the walls, about one to two metres from them, and end where you started.</desc>
  <style>
    .vw-wall{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:square}
    .vw-door{stroke:var(--guide-bg,#fff);stroke-width:7}
    .vw-path{fill:none;stroke:#2f80ed;stroke-width:2.6;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round}
    .vw-lbl{font:13px system-ui,sans-serif;fill:currentColor}
    .vw-start{fill:#eb5757}
  </style>
  <rect class="vw-wall" x="20" y="20" width="140" height="95"/>
  <rect class="vw-wall" x="160" y="20" width="140" height="95"/>
  <rect class="vw-wall" x="20" y="115" width="280" height="70"/>
  <line class="vw-door" x1="70" y1="115" x2="110" y2="115"/>
  <line class="vw-door" x1="210" y1="115" x2="250" y2="115"/>
  <line class="vw-door" x1="20" y1="135" x2="20" y2="165"/>
  <path class="vw-path" d="M30 150 L90 150 L90 90 L45 90 L45 45 L135 45 L135 90 L100 90 L100 135 L230 135 L230 90 L185 90 L185 45 L275 45 L275 90 L240 90 L240 165 L40 165"/>
  <polygon points="80,145 92,150 80,155" fill="#2f80ed"/>
  <circle class="vw-start" cx="28" cy="150" r="7"/>
  <text class="vw-lbl" x="22" y="207">start and end at the entrance · walk slowly</text>
</svg>
