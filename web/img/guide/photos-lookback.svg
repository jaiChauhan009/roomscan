<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-labelledby="lb-t lb-d">
  <title id="lb-t">Photos: one photo looking back</title>
  <desc id="lb-d">Top view of two rooms joined by a door. After the room's photos, stand in the doorway and take one photo looking back into the room you came from. It joins the rooms on the plan.</desc>
  <style>
    .lb-wall{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:square}
    .lb-door{stroke:var(--guide-bg,#fff);stroke-width:7}
    .lb-ray{stroke:#27ae60;stroke-width:2.5;stroke-linecap:round}
    .lb-fan{fill:#27ae60;opacity:.12}
    .lb-lbl{font:13px system-ui,sans-serif;fill:currentColor}
    .lb-tag{font:600 13px system-ui,sans-serif;fill:#27ae60}
    .lb-you{fill:#eb5757}
    .lb-room{font:600 14px system-ui,sans-serif;fill:currentColor;opacity:.55;text-anchor:middle}
  </style>
  <rect class="lb-wall" x="20" y="20" width="135" height="160"/>
  <rect class="lb-wall" x="155" y="20" width="145" height="160"/>
  <line class="lb-door" x1="155" y1="80" x2="155" y2="125"/>
  <text class="lb-room" x="87" y="40">room before</text>
  <text class="lb-room" x="228" y="40">this room</text>
  <path class="lb-fan" d="M160 102 L28 50 L28 160 Z"/>
  <line class="lb-ray" x1="160" y1="102" x2="45" y2="102"/>
  <polygon points="45,96 33,102 45,108" fill="#27ae60"/>
  <circle class="lb-you" cx="160" cy="102" r="8"/>
  <text class="lb-tag" x="40" y="88">last photo</text>
  <text class="lb-lbl" x="22" y="207">look back where you came from</text>
</svg>
