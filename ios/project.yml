name: RoomscanCapture
options:
  bundleIdPrefix: com.roomscan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RoomscanCapture:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RoomscanCapture
    scheme:
      testTargets: [RoomscanCaptureTests, RoomscanCaptureUITests]
      gatherCoverageData: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: roomscan
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: "The camera and LiDAR scanner measure your rooms."
        NSMicrophoneUsageDescription: "Video walkthroughs are recorded with sound."
        NSPhotoLibraryUsageDescription: "Pick room photos and walkthrough videos from your library."
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roomscan.capture
        PRODUCT_NAME: RoomscanCapture
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
  RoomscanCaptureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [RoomscanCaptureTests]
    dependencies:
      - target: RoomscanCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.roomscan.capture.tests
  RoomscanCaptureUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [RoomscanCaptureUITests]
    dependencies:
      - target: RoomscanCapture
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.roomscan.capture.uitests
        TEST_TARGET_NAME: RoomscanCapture
