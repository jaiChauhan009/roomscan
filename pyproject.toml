[project]
name = "roomscan"
version = "0.1.0"
description = "iPhone capture (photos / video / LiDAR) -> measured, stitched floor plan with damage assessment"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "open3d>=0.18",
    "scikit-image>=0.22",
    "shapely>=2.0",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "piexif>=1.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.2",
    "transformers>=4.45",
]
dev = ["pytest>=8.0"]

[project.scripts]
roomscan = "roomscan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roomscan"]

[tool.uv]
python-preference = "managed"
