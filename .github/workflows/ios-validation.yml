name: iOS native validation

on:
  push:
    branches: [codex/native-lidar-validation]
    paths: ["ios/**", ".github/workflows/ios-validation.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-validation.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-device:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build unsigned iPhone and iPad app
        working-directory: ios
        run: |
          set +e
          xcodebuild -project RoomscanCapture.xcodeproj -scheme RoomscanCapture -sdk iphoneos \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          tail -100 build.log
          exit "$status"
      - name: Package unsigned app
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RoomscanCapture.app Payload/
          zip -qry roomscan-validation-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-device-build
          path: |
            ios/build.log
            ios/roomscan-validation-unsigned.ipa
          retention-days: 3

  native-tests:
    name: native-tests-${{ matrix.family }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iphone
            artifact: ios-native-test-evidence
          - family: ipad
            artifact: ios-ipad-test-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Select and boot simulator
        id: simulator
        run: python3 ios/ci/pick_simulator.py --family '${{ matrix.family }}' >> "$GITHUB_OUTPUT"
      - name: Native unit tests and offline preview UI tests
        working-directory: ios
        run: |
          set +e
          xcodebuild test -project RoomscanCapture.xcodeproj -scheme RoomscanCapture -sdk iphonesimulator \
            -destination 'id=${{ steps.simulator.outputs.udid }}' -derivedDataPath build \
            -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO \
            -only-testing:RoomscanCaptureTests -skip-testing:RoomscanCaptureTests/BackendTests \
            -only-testing:RoomscanCaptureUITests/PreviewUITests \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          tail -120 test.log
          exit "$status"
      - name: Collect test results and screenshots
        if: always()
        working-directory: ios
        run: |
          mkdir -p attachments screenshots
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results tests --path TestResults.xcresult > tests.json || true
            xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json || true
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path attachments || true
            python3 ci/name_screenshots.py attachments screenshots
            python3 ci/test_summary.py tests.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            ios/test.log
            ios/tests.json
            ios/summary.json
            ios/screenshots
          retention-days: 3
